<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List App</title>
<style>
:root{--bg:#f3f1ec;--surface:#fff;--ink:#1d2320;--muted:#6b736e;--line:#dcd9d1;--accent:#1f7a5c;--accent-ink:#fff;--danger:#b3372f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1c2420;--ink:#e8ece9;--muted:#8d9791;--line:#2c3631;--accent:#3fbf93;--accent-ink:#0c1612;--danger:#e0776f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1c2420;--ink:#e8ece9;--muted:#8d9791;--line:#2c3631;--accent:#3fbf93;--accent-ink:#0c1612;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.9rem}
form{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
button{font:600 .9rem system-ui,sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:12px 18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:6px;margin-bottom:12px;font-family:system-ui,sans-serif}
.filters button{padding:6px 12px;font-weight:500}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
li .text{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .text{text-decoration:line-through;color:var(--muted)}
li .edit{flex:1;min-width:0}
.actions{display:flex;gap:6px;flex:none}
.actions button{padding:5px 9px;font-weight:500}
.actions .del{color:var(--danger)}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-family:system-ui,sans-serif}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font:.85rem system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <p class="sub" id="count">Loading…</p>
  <form id="addForm">
    <input type="text" id="newTask" placeholder="What needs doing?" maxlength="200" aria-label="New task" autocomplete="off">
    <button class="primary" type="submit">Add task</button>
  </form>
  <div class="filters" role="group" aria-label="Filter tasks">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Completed</button>
  </div>
  <ul id="list"></ul>
  <footer><span id="hint">Saved in this browser</span><button id="clearDone">Clear completed</button></footer>
</main>
<script>
const KEY = "todo.tasks.v1";
let tasks = [], filter = "all", editingId = null;
const $ = s => document.querySelector(s);
const list = $("#list");

function load() {
  try { tasks = JSON.parse(window.localStorage.getItem(KEY)) || []; }
  catch (e) { tasks = []; }
  if (!Array.isArray(tasks)) tasks = [];
}
function save() {
  try { window.localStorage.setItem(KEY, JSON.stringify(tasks)); }
  catch (e) { $("#hint").textContent = "Storage unavailable: tasks won’t persist"; }
}

function render() {
  const shown = tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
  list.innerHTML = "";
  if (!shown.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = tasks.length ? "Nothing in this view." : "No tasks yet. Add your first one above.";
    list.appendChild(li);
  }
  shown.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.setAttribute("aria-label", "Mark complete: " + t.text);
    cb.addEventListener("change", () => toggle(t.id));
    li.appendChild(cb);

    if (editingId === t.id) {
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "edit"; inp.value = t.text; inp.maxLength = 200;
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") commitEdit(t.id, inp.value);
        if (e.key === "Escape") { editingId = null; render(); }
      });
      li.appendChild(inp);
      const a = document.createElement("div"); a.className = "actions";
      a.append(btn("Save", () => commitEdit(t.id, inp.value)), btn("Cancel", () => { editingId = null; render(); }));
      li.appendChild(a);
      setTimeout(() => inp.focus(), 0);
    } else {
      const sp = document.createElement("span");
      sp.className = "text"; sp.textContent = t.text;
      li.appendChild(sp);
      const a = document.createElement("div"); a.className = "actions";
      const d = btn("Delete", () => remove(t.id)); d.classList.add("del");
      a.append(btn("Edit", () => { editingId = t.id; render(); }), d);
      li.appendChild(a);
    }
    list.appendChild(li);
  });
  const left = tasks.filter(t => !t.done).length;
  $("#count").textContent = tasks.length ? left + " of " + tasks.length + " tasks remaining" : "Nothing planned yet";
  $("#clearDone").hidden = !tasks.some(t => t.done);
}
function btn(label, fn) { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.addEventListener("click", fn); return b; }

function add(text) {
  text = text.trim(); if (!text) return;
  tasks.unshift({ id: Date.now() + Math.random().toString(16).slice(2), text, done: false });
  save(); render();
}
function toggle(id) { const t = tasks.find(x => x.id === id); if (t) { t.done = !t.done; save(); render(); } }
function remove(id) { tasks = tasks.filter(x => x.id !== id); save(); render(); }
function commitEdit(id, text) {
  text = text.trim();
  if (!text) { remove(id); editingId = null; return; }
  const t = tasks.find(x => x.id === id); if (t) t.text = text;
  editingId = null; save(); render();
}

$("#addForm").addEventListener("submit", e => { e.preventDefault(); const i = $("#newTask"); add(i.value); i.value = ""; i.focus(); });
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
$("#clearDone").addEventListener("click", () => { tasks = tasks.filter(t => !t.done); save(); render(); });

load(); render();
</script>
</body>
</html>
